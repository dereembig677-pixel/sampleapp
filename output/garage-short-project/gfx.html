<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PE;src:url(Peyda.ttf)}
@font-face{font-family:MO;src:url(Morabba.ttf)}
html,body{margin:0;background:transparent}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Design system: white + yellow only. Safe zone x 60..900, y 250..1420. Motion: blur reveal + expo easing, no bounce.
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WHITE='#FFFFFF',YEL='#FFD60A',PILL='rgba(12,12,14,0.68)';
let PH=[];
window.ready=Promise.all([document.fonts.load('80px PE','سلام'),document.fonts.load('80px MO','سلام'),
  fetch('phrases.json').then(r=>r.json()).then(j=>PH=j)]);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lin=(t,a,b)=>clamp((t-a)/(b-a));
const expoOut=p=>p>=1?1:1-Math.pow(2,-10*p), expoIn=p=>p<=0?0:Math.pow(2,10*p-10);
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
// in/out state: returns {k (0..1 visibility), blur, dy}
function reveal(t,a,b,din=0.32,dout=0.22,rise=22){
  if(t<a||t>b)return null;const pi=expoOut(lin(t,a,a+din)),po=expoIn(lin(t,b-dout,b));
  return {k:pi*(1-po),blur:(1-pi)*14+po*10,dy:(1-pi)*rise-po*rise*0.6,s:0.95+0.05*pi}}
function withReveal(r,cx,cy,fn){ctx.save();ctx.globalAlpha*=r.k;if(r.blur>0.3)ctx.filter=`blur(${r.blur.toFixed(1)}px)`;ctx.translate(cx,cy+r.dy);ctx.scale(r.s,r.s);ctx.translate(-cx,-cy);fn();ctx.restore()}
function shadowText(txt,x,y,size,font,fill,align='center'){ctx.save();ctx.direction='rtl';ctx.font=`${size}px ${font}`;ctx.textAlign=align;
  ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=size*0.28;ctx.shadowOffsetY=size*0.07;ctx.fillStyle=fill;ctx.fillText(txt,x,y);ctx.restore()}

// ---------------- subtitles: dark pill, white text, active word yellow ----------------
const SUBY=1262, FS=58;
function subtitles(t){
  for(const p of PH){if(t<p.a||t>p.b)continue;
    const r=reveal(t,p.a,p.b,0.18,0.10,14);if(!r)continue;
    ctx.save();ctx.direction='rtl';ctx.font=`${FS}px PE`;
    const sp=FS*0.26, ws=p.w.map(w=>ctx.measureText(w[0]).width), tw=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
    const padX=36,ph=FS*1.62, bw=tw+padX*2, x0=W/2-bw/2, y0=SUBY-ph/2;
    withReveal(r,W/2,SUBY,()=>{
      rr(x0,y0,bw,ph,ph/2);ctx.fillStyle=PILL;ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=24;ctx.shadowOffsetY=6;ctx.fill();
      ctx.shadowColor='transparent';ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.stroke();
      let xr=W/2+tw/2;ctx.textAlign='right';ctx.textBaseline='middle';
      p.w.forEach(([txt,s,em],i)=>{
        const next=p.w[i+1]?p.w[i+1][1]:p.b;const on=lin(t,s-0.02,s+0.06);const active=t>=s-0.02&&t<next;
        const yelK=em?on:(active?on*(1-lin(t,next-0.02,next+0.06)):0);
        ctx.fillStyle=yelK>0.5?YEL:WHITE;ctx.globalAlpha=0.94+0.06*on;
        if(yelK>0&&yelK<1){ctx.fillStyle=WHITE;ctx.fillText(txt,xr,SUBY+3);ctx.globalAlpha=yelK;ctx.fillStyle=YEL}
        ctx.fillText(txt,xr,SUBY+3);ctx.globalAlpha=1;xr-=ws[i]+sp});
    });ctx.restore()}
}
// ---------------- title moments ----------------
function wordsReveal(t,words,x,y,size,font,t0,step,b,colors){ // RTL word-by-word reveal on one line
  ctx.save();ctx.direction='rtl';ctx.font=`${size}px ${font}`;const sp=size*0.24;const ws=words.map(w=>ctx.measureText(w).width);const tw=ws.reduce((a,c)=>a+c,0)+sp*(ws.length-1);
  let xr=x+tw/2;words.forEach((w,i)=>{const r=reveal(t,t0+i*step,b,0.36,0.24,26);if(r){const cx=xr-ws[i]/2;withReveal(r,cx,y,()=>shadowText(w,xr,y,size,font,colors[i]||WHITE,'right'))}xr-=ws[i]+sp});ctx.restore()}
function hook(t){wordsReveal(t,['مهره‌ای','که'],W/2-60,410,66,'MO',0.12,0.08,2.95,[WHITE,WHITE]);
  wordsReveal(t,['باز','نمی‌شد!'],W/2-60,530,124,'PE',0.30,0.12,2.95,[YEL,YEL])}
// label pill (on B-roll card)
function labelPill(t,a,b,parts,x,y,size=40){const r=reveal(t,a,b,0.3,0.2,12);if(!r)return;ctx.save();ctx.direction='rtl';ctx.font=`${size}px PE`;
  const sp=size*0.3;const ws=parts.map(p=>ctx.measureText(p[0]).width);const tw=ws.reduce((a,c)=>a+c,0)+sp*(ws.length-1);const ph=size*1.6,bw=tw+size*1.2;
  withReveal(r,x+bw/2,y,()=>{rr(x,y-ph/2,bw,ph,ph/2);ctx.fillStyle=PILL;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.stroke();
    let xr=x+bw/2+tw/2;ctx.textAlign='right';ctx.textBaseline='middle';parts.forEach((p,i)=>{ctx.fillStyle=p[1];ctx.fillText(p[0],xr,y+2);xr-=ws[i]+sp})});ctx.restore()}
function boxLabel(t){labelPill(t,20.22,21.86,[['بکس',WHITE],['۳۵',YEL],['·',WHITE],['فشارقوی',WHITE],['·',WHITE],['درایو ۳/۴',YEL]],150,664)}
function axleTitle(t){wordsReveal(t,['پلوس'],W/2-60,520,150,'PE',29.62,0.1,31.24,[YEL]);
  wordsReveal(t,['شفت','انتقال','نیرو','به','چرخ'],W/2-60,615,52,'MO',29.82,0.05,31.24,[WHITE,WHITE,WHITE,WHITE,WHITE])}
function mashallah(t){const T=[[53.78,92,WHITE],[55.30,108,WHITE],[56.13,150,YEL]];const end=57.35;if(t<53.7||t>end)return;
  T.forEach(([t0,size,col],i)=>{if(t<t0)return;
    let off=0,dim=0;for(let j=i+1;j<T.length;j++){const m=expoOut(lin(t,T[j][0],T[j][0]+0.42));off+=m*(T[j][1]*1.22);dim=Math.max(dim,m)}
    const y=900-off;
    const r=reveal(t,t0,end,0.38,0.28,28);if(!r)return;ctx.save();ctx.globalAlpha=1-0.4*dim;
    withReveal(r,W/2-60,y,()=>shadowText('ماشالله!',W/2-60,y,size,'PE',col));ctx.restore()})}
function contd(t){const r=reveal(t,67.45,71.35,0.4,0.3,12);if(!r)return;ctx.save();ctx.direction='rtl';ctx.font='54px MO';const n=Math.floor((t-67.45)*2.5)%4;const txt='ادامه دارد';
  const tw=ctx.measureText(txt+'...').width;const ph=88,bw=tw+76;withReveal(r,W/2,SUBY,()=>{rr(W/2-bw/2,SUBY-ph/2,bw,ph,ph/2);ctx.fillStyle=PILL;ctx.fill();
    ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=WHITE;ctx.fillText(txt+'.'.repeat(n),W/2+tw/2,SUBY+2)});ctx.restore()}
// ---------------- CTA ----------------
function bell(x,y,s,rot,filled){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-24,12);ctx.quadraticCurveTo(-23,-28,0,-30);ctx.quadraticCurveTo(23,-28,24,12);ctx.lineTo(30,20);ctx.lineTo(-30,20);ctx.closePath();
  ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle=filled?YEL:WHITE;ctx.fillStyle=YEL;if(filled)ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,28,6,0,7);ctx.fillStyle=filled?YEL:WHITE;ctx.fill();ctx.restore()}
function thumb(x,y,s,filled){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(-2,-36);ctx.quadraticCurveTo(13,-40,11,-20);ctx.lineTo(8,-6);ctx.lineTo(30,-6);ctx.quadraticCurveTo(40,-4,37,8);ctx.lineTo(30,34);ctx.quadraticCurveTo(26,42,16,42);ctx.lineTo(-14,42);ctx.closePath();
  ctx.rect(-32,-4,12,46);ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle=filled?YEL:WHITE;if(filled){ctx.fillStyle=YEL;ctx.fill()}ctx.stroke();ctx.restore()}
function cursor(x,y,press){ctx.save();ctx.translate(x,y);ctx.scale(press?0.86:1,press?0.86:1);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  ctx.fillStyle=WHITE;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,52);ctx.lineTo(13,40);ctx.lineTo(24,63);ctx.lineTo(33,59);ctx.lineTo(22,37);ctx.lineTo(39,37);ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';ctx.lineWidth=2.5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.stroke();ctx.restore()}
function ripple(t,t0,x,y){const p=lin(t,t0,t0+0.45);if(p<=0||p>=1)return;ctx.save();ctx.globalAlpha=(1-p)*0.7;ctx.strokeStyle=WHITE;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,14+expoOut(p)*46,0,7);ctx.stroke();ctx.restore()}
function cta(t){const a=72.30,b=80.72;const r=reveal(t,a,b,0.45,0.32,-30);if(!r)return;
  const CY=380, X0=120, X1=900;
  withReveal(r,(X0+X1)/2,CY,()=>{
    rr(X0,CY-92,X1-X0,184,92);ctx.fillStyle=PILL;ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=30;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.stroke();
    // avatar (generic)
    ctx.beginPath();ctx.arc(X1-92,CY,62,0,7);ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=WHITE;ctx.stroke();
    ctx.fillStyle=WHITE;ctx.beginPath();ctx.arc(X1-92,CY-14,19,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(X1-92,CY+34,34,22,0,Math.PI,0);ctx.fill();
    // subscribe button
    const sub=t>=72.88;const k=expoOut(lin(t,72.88,73.2));const bx=X1-200-330,bw=330;
    rr(bx,CY-46,bw,92,46);ctx.fillStyle=WHITE;ctx.fill();if(k>0){ctx.save();ctx.globalAlpha=k;rr(bx,CY-46,bw,92,46);ctx.fillStyle=YEL;ctx.fill();ctx.restore()}
    ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='42px PE';ctx.fillStyle='#111';
    ctx.globalAlpha=1-k;ctx.fillText('سابسکرایب',bx+bw/2,CY+3);ctx.globalAlpha=k;ctx.fillText('سابسکرایب شد ✓',bx+bw/2,CY+3);ctx.globalAlpha=1;
    // bell
    const bt=t-73.0;const rot=bt>0&&bt<1.2?Math.sin(bt*16)*0.32*Math.exp(-bt*3.2):0;bell(X0+95,CY,1.15,rot,t>=73.0);
  });
  // like pill (second row)
  const lr=reveal(t,73.85,b,0.4,0.32,-20);if(lr){const LY=548,LX0=X1-300;withReveal(lr,LX0+150,LY,()=>{
    rr(LX0,LY-52,300,104,52);ctx.fillStyle=PILL;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.stroke();
    const lk=t>=74.62;const pk=expoOut(lin(t,74.62,74.9));thumb(LX0+230,LY-2,1.0+0.12*Math.sin(Math.PI*pk)*(pk<1?1:0),lk);
    ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='42px PE';ctx.fillStyle=lk?YEL:WHITE;ctx.fillText(lk?'لایک شد':'لایک',LX0+110,LY+3)})}
  // cursor path
  const P0=[980,900],P1=[X1-230-165,402],P2=[X1-70,560],P3=[1100,980];
  const seg=(A,B,p)=>{const e=eIO(p);return[A[0]+(B[0]-A[0])*e,A[1]+(B[1]-A[1])*e-Math.sin(Math.PI*e)*60]};
  let c;if(t<72.88)c=seg(P0,P1,lin(t,72.45,72.84));else if(t<74.62)c=seg(P1,P2,lin(t,74.05,74.58));else c=seg(P2,P3,lin(t,75.1,75.7));
  const press=(t>=72.84&&t<72.98)||(t>=74.58&&t<74.72);
  if(t>72.4&&t<75.7){ctx.save();ctx.globalAlpha=r.k*Math.min(1,lin(t,72.4,72.6));cursor(c[0],c[1],press);ctx.restore()}
  ripple(t,72.86,P1[0]+4,P1[1]+4);ripple(t,74.60,P2[0]+4,P2[1]+4);
}
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.filter='none';
  hook(t);boxLabel(t);axleTitle(t);mashallah(t);contd(t);cta(t);subtitles(t)}
window.render=render;
</script></body></html>
